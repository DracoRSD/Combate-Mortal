<!doctype html>
<!--
  COMBATE MORTAL FREESTYLE · TORNEO EN OTRA PANTALLA
  Las mismas vistas del torneo del operador, en una ventana aparte y sincronizadas con él
  (mismo navegador y mismo perfil: iniciar.bat las abre así).
      http://localhost:8000/torneo.html#bracket     bracket completo (1560x960; en una ventana vertical, p. ej. 640x1024, sale el bracket vertical)
      http://localhost:8000/torneo.html#vertical    bracket vertical (640x1024) en cualquier ventana
      http://localhost:8000/torneo.html#historias   historias 1080x1920, una tarjeta por grupo
      http://localhost:8000/torneo.html#llave       llave de la ronda 1080x1350
  Teclas: V cambiar de vista · ← → otra ronda (historias y llave) · E descargar PNG ·
          F pantalla completa · Shift+R reiniciar resultados (pide confirmación).
  Clic en un nombre o una foto: ganador (solo si el cruce no tiene ganador; cambiarlo: Shift+clic o ?ensayo=1).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMF · Torneo</title>
<link rel="stylesheet" href="css/torneo-vistas.css?v=18">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  .cmft-falta { color: #fff; font: 18px/1.5 system-ui, sans-serif; padding: 40px; }
</style>
</head>
<body>
<div id="cmft"></div>
<script src="js/torneo-vistas.js?v=18"></script>
<script>
  /* Tamaño y posición que pide iniciar.bat (?tam=640x1024&pos=320,0): solo en ventanas de aplicación; en una pestaña no hace nada. */
  (function () {
    var q = new URLSearchParams(location.search);
    var tam = /^(\d+)x(\d+)$/.exec(q.get('tam') || ''), pos = /^(-?\d+),(-?\d+)$/.exec(q.get('pos') || '');
    if (!tam && !pos) return;
    function aplicar() {
      if (document.fullscreenElement) return;
      try {
        if (pos) window.moveTo(+pos[1], +pos[2]);
        if (tam) window.resizeTo(+tam[1] + window.outerWidth - window.innerWidth, +tam[2] + window.outerHeight - window.innerHeight);
      } catch (e) {}
    }
    if (document.readyState === 'complete') aplicar(); else window.addEventListener('load', aplicar);
  })();
  if (window.CMFTorneo) window.CMFTorneo.pantalla(document.getElementById('cmft'));
  else document.body.innerHTML = '<p class="cmft-falta">No se encontró js/torneo-vistas.js. Abre esta página desde el servidor (iniciar.bat), con la carpeta completa del proyecto.</p>';
</script>
</body>
</html>
