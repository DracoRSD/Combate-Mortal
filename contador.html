<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temporizador Combate Mortal</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base/variables.css">
    <link rel="stylesheet" href="css/pages/timer.css">
</head>
<body>
    <canvas id="boltCanvas" class="bolt-canvas"></canvas>

    <header class="cm-brand">
        <img class="cm-badge" src="assets/images/logo-dragon.png" alt="Combate Mortal" />
        <span class="cm-brand__text chrome-text">Combate Mortal</span>
    </header>

    <div class="bracket-bar">
        <div class="bracket-field">
            <label for="stageSelect">Etapa</label>
            <select id="stageSelect">
                <option>Octavos de Final</option>
                <option>Cuartos de Final</option>
                <option>Repesca</option>
                <option>Semifinal</option>
                <option>Final</option>
            </select>
        </div>
        <div class="battle-counter">
            <button class="step-btn" id="battleDown" aria-label="Batalla anterior">&minus;</button>
            <div class="battle-num">Batalla <span id="battleNum">1</span></div>
            <button class="step-btn" id="battleUp" aria-label="Siguiente batalla">+</button>
        </div>
        <div class="battle-counter" id="entradaField" hidden>
            <button class="step-btn" id="entradaDown" aria-label="Entrada anterior">&minus;</button>
            <div class="battle-num">Entrada <span id="entradaNum">1</span>/<span id="entradaTotal">2</span></div>
            <button class="step-btn" id="entradaUp" aria-label="Siguiente entrada">+</button>
        </div>
    </div>

    <div class="format-info" id="formatInfo">MINUTO LIBRE</div>

    <div class="duel">
        <div class="mc" data-side="a" id="mcA">
            <div class="mc-turn-tag" id="tagA">TURNO</div>
            <div class="hp-bar"><div class="hp-bar__fill" id="hpAFill"></div></div>
            <button type="button" class="mc-frame" id="mcAFrame" data-nav-item aria-label="Elegir a MC 1 como ganador">
                <canvas class="mc-frame__bolts" data-bolts></canvas>
                <img id="mcAPhoto" class="mc-frame__photo" alt="" />
                <div class="mc-frame__fallback" id="mcAFallback"></div>
                <div class="mc-frame__hitflash"></div>
            </button>
            <div class="mc-name" id="mcAName">MC 1</div>
            <div class="mc-country" id="mcACountry"></div>
        </div>

        <div class="circle-timer">
            <svg class="progress-ring" width="320" height="320">
                <circle
                    class="progress-ring__circle"
                    r="140"
                    cx="160"
                    cy="160"
                />
            </svg>

            <div class="time-wrapper">
                <div class="time-number" id="countdown">60</div>
                <div class="time-label" id="timeLabel">SEGUNDOS</div>
            </div>
        </div>

        <div class="mc" data-side="b" id="mcB">
            <div class="mc-turn-tag" id="tagB">TURNO</div>
            <div class="hp-bar"><div class="hp-bar__fill" id="hpBFill"></div></div>
            <button type="button" class="mc-frame" id="mcBFrame" data-nav-item aria-label="Elegir a MC 2 como ganador">
                <canvas class="mc-frame__bolts" data-bolts></canvas>
                <img id="mcBPhoto" class="mc-frame__photo" alt="" />
                <div class="mc-frame__fallback" id="mcBFallback"></div>
                <div class="mc-frame__hitflash"></div>
            </button>
            <div class="mc-name" id="mcBName">MC 2</div>
            <div class="mc-country" id="mcBCountry"></div>
        </div>
    </div>

    <div class="word-label" id="word-label">MORTAL</div>

    <div class="controls" id="controls">
        <button id="btnIniciar" class="btn-start" data-nav-item>Iniciar</button>
        <button id="btnGolpe" class="btn-hit" data-nav-item>Golpe</button>
        <button id="btnReiniciar" class="btn-reset" data-nav-item>Reiniciar</button>
        <button id="btnTurno" class="btn-turn" data-nav-item>Cambiar turno</button>
        <button id="btnSiguienteBatalla" class="btn-next" data-nav-item>Siguiente batalla</button>
        <button id="btnVolver" class="btn-back" data-nav-item>Volver</button>
    </div>

    <p class="hint">
        <kbd>Espacio</kbd> iniciar &nbsp;·&nbsp; <kbd>G</kbd> golpe &nbsp;·&nbsp; <kbd>Retroceso</kbd> reiniciar &nbsp;·&nbsp;
        <kbd>T</kbd> turno &nbsp;·&nbsp; <kbd>N</kbd> siguiente batalla &nbsp;·&nbsp; <kbd>Esc</kbd> volver &nbsp;·&nbsp;
        <kbd>Enter</kbd> en una foto declara ganador
    </p>

    <div class="winner-overlay" id="winnerOverlay" hidden>
        <div class="winner-label">GANADOR</div>
        <div class="winner-portrait">
            <img id="winnerPhoto" class="winner-portrait__photo" alt="" />
            <div class="winner-portrait__fallback" id="winnerFallback"></div>
        </div>
        <div class="winner-name" id="winnerName"></div>
        <button class="btn-back" id="btnCerrarGanador" data-nav-item>Cerrar</button>
    </div>

    <!-- Importar JavaScript modular con type="module" -->
    <script type="module" src="js/timer.js"></script>
</body>
</html>
