<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Combate Mortal Freestyle</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base/variables.css">
    <link rel="stylesheet" href="css/pages/index.css">
</head>
<body>
    <canvas id="boltCanvas" class="bolt-canvas"></canvas>

    <div class="app">
        <header class="cm-brand">
            <div class="cm-badge" aria-hidden="true">
                <svg viewBox="0 0 120 120">
                    <circle class="cm-badge__ring" cx="60" cy="60" r="50"></circle>
                    <path class="cm-badge__dragon" d="M40 38c10-10 26-10 34 0 6 7 4 16-2 20 8 2 12 10 8 18-5 10-20 12-30 4-4 10-16 14-24 8-9-7-8-21 1-27-8-3-10-13-4-19 5-5 12-6 17-4z"></path>
                </svg>
            </div>
            <span class="cm-brand__text chrome-text">Combate Mortal</span>
        </header>
        <div class="cm-tagline">Sangre, sudor y barras</div>

        <!-- ================= Selección de formato ================= -->
        <section class="screen active" id="screenFormat">
            <h2 class="format-h2">Selecciona el formato</h2>
            <div class="format-options">
                <div class="format-card" data-format="minutoLibre" data-time="60" data-name="MINUTO LIBRE">
                    <h3>Minuto libre</h3>
                    <p>60 segundos</p>
                    <div class="format-icon">🔥</div>
                </div>
                <div class="format-card" data-format="tematica" data-time="120" data-name="TEMÁTICA">
                    <h3>Temática</h3>
                    <p>120 segundos</p>
                    <div class="format-icon">🎭</div>
                </div>
                <div class="format-card" data-format="minutosLibre" data-time="120" data-name="MINUTOS LIBRE">
                    <h3>Minutos libre</h3>
                    <p>120 segundos</p>
                    <div class="format-icon">⏳</div>
                </div>
            </div>
        </section>

        <!-- ================= Selección de luchadores ================= -->
        <section class="screen" id="screenSelect">
            <div class="format-badge" id="formatBadge">MINUTO LIBRE — 60S</div>

            <div class="duel-preview">
                <div class="fighter-slot" id="slotLeft">
                    <img alt="" />
                    <video muted loop playsinline>Tu navegador no soporta video.</video>
                    <div class="fighter-slot__fallback"></div>
                    <div class="fighter-slot__icon">⚔️</div>
                    <div class="fighter-slot__text">Selecciona tu luchador</div>
                    <div class="fighter-slot__name"></div>
                </div>
                <div class="vs-badge" id="vsBadge">VS</div>
                <div class="fighter-slot" id="slotRight">
                    <img alt="" />
                    <video muted loop playsinline>Tu navegador no soporta video.</video>
                    <div class="fighter-slot__fallback"></div>
                    <div class="fighter-slot__icon">⚔️</div>
                    <div class="fighter-slot__text">Selecciona tu luchador</div>
                    <div class="fighter-slot__name"></div>
                </div>
            </div>

            <div class="select-hint side-left" id="selectHint">Selecciona el primer luchador</div>

            <div class="fighter-grid" id="fighterGrid"></div>

            <button class="fight-button" id="fightButton">¡Fight!</button>
        </section>
    </div>

    <script type="module" src="js/index.js"></script>
</body>
</html>
