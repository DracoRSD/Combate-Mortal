<!doctype html>
<!--
  COMBATE MORTAL FREESTYLE · TORNEO EN OTRA PANTALLA
  Las mismas vistas del torneo del operador, en una ventana aparte y sincronizadas con él
  (mismo navegador y mismo perfil: iniciar.bat las abre así).
      http://localhost:8000/torneo.html#bracket     bracket completo (1560x960)
      http://localhost:8000/torneo.html#historias   historias 1080x1920, una tarjeta por grupo
      http://localhost:8000/torneo.html#llave       llave de la ronda 1080x1350
  Teclas: V cambiar de vista · ← → otra ronda (historias y llave) · E descargar PNG ·
          F pantalla completa · Shift+R reiniciar resultados (pide confirmación).
  Clic en un nombre o una foto: ganador (solo si el cruce no tiene ganador; cambiarlo: Shift+clic o ?ensayo=1).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMF · Torneo</title>
<link rel="stylesheet" href="css/torneo-vistas.css?v=15">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  .cmft-falta { color: #fff; font: 18px/1.5 system-ui, sans-serif; padding: 40px; }
</style>
</head>
<body>
<div id="cmft"></div>
<script src="js/torneo-vistas.js?v=15"></script>
<script>
  if (window.CMFTorneo) window.CMFTorneo.pantalla(document.getElementById('cmft'));
  else document.body.innerHTML = '<p class="cmft-falta">No se encontró js/torneo-vistas.js. Abre esta página desde el servidor (iniciar.bat), con la carpeta completa del proyecto.</p>';
</script>
</body>
</html>
