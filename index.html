<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Combate Mortal Freestyle</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base/variables.css">
    <link rel="stylesheet" href="css/pages/index.css">
</head>
<body>
    <canvas id="boltCanvas" class="bolt-canvas"></canvas>

    <div class="app">
        <header class="cm-brand">
            <img class="cm-badge" src="assets/images/logo-dragon.png" alt="Combate Mortal" />
            <span class="cm-brand__text chrome-text">Combate Mortal</span>
        </header>
        <div class="cm-tagline">Sangre, sudor y barras</div>

        <!-- ================= Selección de formato ================= -->
        <section class="screen active" id="screenFormat">
            <h2 class="format-h2">Selecciona el formato</h2>
            <div class="mode-grid" id="formatGrid">
                <button class="mode-card mode-card--wide" data-format="minutoIdaVuelta" data-nav-item>
                    <div class="mode-card__art"></div>
                    <div class="mode-card__scrim"></div>
                    <h3 class="mode-card__title">Minuto Ida y Vuelta</h3>
                    <p class="mode-card__desc">60s × 2 entradas</p>
                </button>
                <button class="mode-card" data-format="cuatroXcuatro" data-nav-item>
                    <div class="mode-card__art"></div>
                    <div class="mode-card__scrim"></div>
                    <h3 class="mode-card__title">4x4 Libre</h3>
                    <p class="mode-card__desc">120 segundos</p>
                </button>
                <button class="mode-card" data-format="ochoXocho" data-nav-item>
                    <div class="mode-card__art"></div>
                    <div class="mode-card__scrim"></div>
                    <h3 class="mode-card__title">8x8 Temática</h3>
                    <p class="mode-card__desc">120s · palabra temática</p>
                </button>
                <button class="mode-card" data-format="doceXdoce" data-nav-item>
                    <div class="mode-card__art"></div>
                    <div class="mode-card__scrim"></div>
                    <h3 class="mode-card__title">12x12 Ida y Vuelta</h3>
                    <p class="mode-card__desc">30s × 3 entradas</p>
                </button>
                <button class="mode-card" data-format="dosXdos" data-nav-item>
                    <div class="mode-card__art"></div>
                    <div class="mode-card__scrim"></div>
                    <h3 class="mode-card__title">2x2 Ida y Vuelta</h3>
                    <p class="mode-card__desc">30s × 5 entradas</p>
                </button>
                <button class="mode-card mode-card--hero" data-format="fatality" data-nav-item>
                    <div class="mode-card__art"></div>
                    <div class="mode-card__scrim"></div>
                    <div class="mode-card__body">
                        <h3 class="mode-card__title">Fatality</h3>
                        <p class="mode-card__subtitle">Sin límite. Decide el jurado.</p>
                        <span class="mode-card__play">Play</span>
                    </div>
                </button>
            </div>
        </section>

        <!-- ================= Selección de luchadores ================= -->
        <section class="screen" id="screenSelect">
            <div class="format-badge" id="formatBadge">MINUTO LIBRE — 60S</div>

            <div class="duel-preview">
                <div class="fighter-slot" id="slotLeft">
                    <img alt="" />
                    <video muted loop playsinline>Tu navegador no soporta video.</video>
                    <div class="fighter-slot__fallback"></div>
                    <div class="fighter-slot__icon">⚔️</div>
                    <div class="fighter-slot__text">Selecciona tu luchador</div>
                    <div class="fighter-slot__name"></div>
                </div>
                <div class="vs-badge" id="vsBadge">VS</div>
                <div class="fighter-slot" id="slotRight">
                    <img alt="" />
                    <video muted loop playsinline>Tu navegador no soporta video.</video>
                    <div class="fighter-slot__fallback"></div>
                    <div class="fighter-slot__icon">⚔️</div>
                    <div class="fighter-slot__text">Selecciona tu luchador</div>
                    <div class="fighter-slot__name"></div>
                </div>
            </div>

            <div class="select-hint side-left" id="selectHint">Selecciona el primer luchador</div>

            <div class="fighter-grid" id="fighterGrid"></div>

            <div class="select-controls">
                <button class="btn-back" id="btnVolverFormato">Volver</button>
                <button class="fight-button" id="fightButton">¡Fight!</button>
            </div>
        </section>
    </div>

    <script type="module" src="js/index.js"></script>
</body>
</html>
